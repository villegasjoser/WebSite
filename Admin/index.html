<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento | Villa Aliris</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 40px 20px; }
    .container { max-width: 750px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    /* Header con Logo */
    .header-logo { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #eef2f5; padding-bottom: 15px; }
    .header-logo img { max-width: 180px; height: auto; display: block; margin: 0 auto 10px auto; }
    
    h2 { font-size: 1.5rem; color: #1a252f; margin-bottom: 20px; }
    
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 40px; }
    .full-width { grid-column: span 2; }
    
    label { font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 5px; display: block; }
    input, textarea, select { width: 100%; padding: 10px 12px; font-size: 0.95rem; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; transition: border 0.2s; background-color: #fff; }
    input:focus, textarea:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    
    /* Pestañas de Idiomas */
    .lang-tabs { display: flex; gap: 10px; border-bottom: 2px solid #e2e8f0; margin-bottom: 15px; }
    .tab-btn { background: none; border: none; padding: 8px 16px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }
    .lang-content { display: none; grid-template-columns: 1fr 1fr; gap: 15px; }
    .lang-content.active { display: grid; }

    /* Flex para horarios de inicio y fin */
    .time-group { display: flex; gap: 10px; margin-top: 6px; }
    .time-group > div { flex: 1; }

    button[type="submit"] { background-color: #2563eb; color: white; border: none; padding: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    button[type="submit"]:hover { background-color: #1d4ed8; }
    
    .item-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .btn-delete { background-color: #ef4444; color: white; border: none; padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; cursor: pointer; }
    .btn-delete:hover { background-color: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-logo">
      <img src="../Images/MainPage/logo.jpeg" alt="Logo Villa Aliris" onerror="this.style.display='none'">
      <h2>Mantenimiento de Experiencias</h2>
    </div>
    
    <form id="aventuraForm">
      <!-- Selección de Ícono Vectorial -->
      <div class="full-width">
        <label for="icono">Ícono de la Actividad</label>
        <select id="icono" required>
          <optgroup label="Aventura y Naturaleza">
            <option value="flame">🔥 Fuego / Aventura (bi-fire)</option>
            <option value="tree">🌲 Bosque / Árboles (bi-tree-fill)</option>
            <option value="mountain">⛰️ Montaña / Senderismo (bi-triangle-fill)</option>
            <option value="water">🌊 Agua / Cascada / Río (bi-water)</option>
            <option value="compass">🧭 Tour / Exploración (bi-compass-fill)</option>
            <option value="binoculars">🔭 Avistamiento / Fauna (bi-binoculars-fill)</option>
            <option value="camera">📸 Mirador / Fotografía (bi-camera-fill)</option>
          </optgroup>
          <optgroup label="Servicios y Facilidades">
            <option value="utensils">🍽️ Gastronomía / Comida (bi-cup-hot-fill)</option>
            <option value="car">🚗 Parqueo / Acceso (bi-car-front-fill)</option>
            <option value="ticket">🎟️ Entradas / Pases (bi-ticket-perforated-fill)</option>
            <option value="map-location-dot">📍 Ubicación (bi-geo-alt-fill)</option>
          </optgroup>
        </select>
      </div>

      <!-- Sección Multilenguaje con Pestañas -->
      <div class="full-width">
        <div class="lang-tabs">
          <button type="button" class="tab-btn active" onclick="cambiarTab('es')">🇪🇸 Español</button>
          <button type="button" class="tab-btn" onclick="cambiarTab('en')">🇺🇸 English</button>
          <button type="button" class="tab-btn" onclick="cambiarTab('pt')">🇧🇷 Português</button>
        </div>

        <!-- Pestaña Español -->
        <div id="tab-es" class="lang-content active">
          <div class="full-width">
            <label for="nombre_es">Nombre (Español)</label>
            <input type="text" id="nombre_es" placeholder="ej. Parque Nacional Rincón de la Vieja" required>
          </div>
          <div class="full-width">
            <label for="descripcion_es">Descripción (Español)</label>
            <textarea id="descripcion_es" rows="2" placeholder="Senderos entre volcanes, pailas de lodo..." required></textarea>
          </div>
          <div class="full-width">
            <label for="horario_es">Horario de atención (Español)</label>
            <input type="text" id="horario_es" placeholder="ej. Martes a Domingo, 8:00 a.m. - 3:00 p.m." required>
          </div>
          <div>
            <label for="costo_nac_es">Costo Nacionales (Español)</label>
            <input type="text" id="costo_nac_es" placeholder="ej. ₡1,000" required>
          </div>
          <div>
            <label for="costo_ext_es">Costo Extranjeros (Español)</label>
            <input type="text" id="costo_ext_es" placeholder="ej. $15" required>
          </div>
          <div class="full-width">
            <label for="btn_web_es">Texto del Botón Web (Español)</label>
            <input type="text" id="btn_web_es" value="Sitio Web Oficial" required>
          </div>
        </div>

        <!-- Pestaña Inglés -->
        <div id="tab-en" class="lang-content">
          <div class="full-width">
            <label for="nombre_en">Name (English)</label>
            <input type="text" id="nombre_en" placeholder="e.g. Rincón de la Vieja National Park" required>
          </div>
          <div class="full-width">
            <label for="descripcion_en">Description (English)</label>
            <textarea id="descripcion_en" rows="2" placeholder="Trails between volcanoes, mud pots..." required></textarea>
          </div>
          <div class="full-width">
            <label for="horario_en">Hours of Operation (English)</label>
            <input type="text" id="horario_en" placeholder="e.g. Tuesday to Sunday, 8:00 AM - 3:00 PM" required>
          </div>
          <div>
            <label for="costo_nac_en">National Cost (English)</label>
            <input type="text" id="costo_nac_en" placeholder="e.g. CRC 1,000" required>
          </div>
          <div>
            <label for="costo_ext_en">Foreigner Cost (English)</label>
            <input type="text" id="costo_ext_en" placeholder="e.g. USD $15" required>
          </div>
          <div class="full-width">
            <label for="btn_web_en">Web Button Text (English)</label>
            <input type="text" id="btn_web_en" value="Official Website" required>
          </div>
        </div>

        <!-- Pestaña Portugués -->
        <div id="tab-pt" class="lang-content">
          <div class="full-width">
            <label for="nombre_pt">Nome (Português)</label>
            <input type="text" id="nombre_pt" placeholder="ex. Parque Nacional Rincón de la Vieja" required>
          </div>
          <div class="full-width">
            <label for="descripcion_pt">Descrição (Português)</label>
            <textarea id="descripcion_pt" rows="2" placeholder="Trilhas entre vulcões..." required></textarea>
          </div>
          <div class="full-width">
            <label for="horario_pt">Horário de funcionamento (Português)</label>
            <input type="text" id="horario_pt" placeholder="ex. Terça a Domingo, 08:00 - 15:00" required>
          </div>
          <div>
            <label for="costo_nac_pt">Custo Nacionais (Português)</label>
            <input type="text" id="costo_nac_pt" placeholder="ex. ₡1.000" required>
          </div>
          <div>
            <label for="costo_ext_pt">Custo Estrangeiros (Português)</label>
            <input type="text" id="costo_ext_pt" placeholder="ex. US$ 15" required>
          </div>
          <div class="full-width">
            <label for="btn_web_pt">Texto do Botão Web (Português)</label>
            <input type="text" id="btn_web_pt" value="Site Oficial" required>
          </div>
        </div>
      </div>

      <!-- URL del Sitio Web (Común para todos los idiomas) -->
      <div class="full-width">
        <label for="sitioWeb">Enlace / URL del Sitio Web Oficial</label>
        <input type="url" id="sitioWeb" placeholder="https://..." required>
      </div>

      <button type="submit" class="full-width">Guardar Experiencia Multilenguaje</button>
    </form>

    <h2>Experiencias Registradas</h2>
    <div id="listaAventuras"></div>
  </div>

  <script>
    let aventuras = [];

    function cambiarTab(lang) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.lang-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`tab-${lang}`).classList.add('active');
    }

    async function cargarAventuras() {
      try {
        const res = await fetch('/api/aventuras');
        aventuras = await res.json();
        renderizar();
      } catch (err) {
        console.error("Error al cargar las aventuras:", err);
      }
    }

    function renderizar() {
      const contenedor = document.getElementById('listaAventuras');
      contenedor.innerHTML = aventuras.map((a, i) => {
        const nombreMostrar = typeof a.nombre === 'object' ? a.nombre.es : a.nombre;
        const horarioMostrar = typeof a.horario === 'object' ? a.horario.es : a.horario;
        return `
          <div class="item-card">
            <div>
              <strong>${nombreMostrar}</strong>
              <p style="font-size: 0.85rem; color: #666;">${horarioMostrar}</p>
            </div>
            <button class="btn-delete" onclick="eliminar(${i})">Eliminar</button>
          </div>
        `;
      }).join('');
    }

    document.getElementById('aventuraForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nuevaAventura = {
        id: 'exp-' + Date.now(),
        icono: document.getElementById('icono').value,
        nombre: {
          es: document.getElementById('nombre_es').value,
          en: document.getElementById('nombre_en').value,
          pt: document.getElementById('nombre_pt').value
        },
        descripcion: {
          es: document.getElementById('descripcion_es').value,
          en: document.getElementById('descripcion_en').value,
          pt: document.getElementById('descripcion_pt').value
        },
        horario: {
          es: document.getElementById('horario_es').value,
          en: document.getElementById('horario_en').value,
          pt: document.getElementById('horario_pt').value
        },
        costo: {
          nacionales: {
            es: document.getElementById('costo_nac_es').value,
            en: document.getElementById('costo_nac_en').value,
            pt: document.getElementById('costo_nac_pt').value
          },
          extranjeros: {
            es: document.getElementById('costo_ext_es').value,
            en: document.getElementById('costo_ext_en').value,
            pt: document.getElementById('costo_ext_pt').value
          }
        },
        botonWeb: {
          es: document.getElementById('btn_web_es').value,
          en: document.getElementById('btn_web_en').value,
          pt: document.getElementById('btn_web_pt').value
        },
        sitioWeb: document.getElementById('sitioWeb').value
      };

      aventuras.push(nuevaAventura);
      await hacerGuardado();
      e.target.reset();
    });

    async function eliminar(index) {
      aventuras.splice(index, 1);
      await hacerGuardado();
    }

    async function hacerGuardado() {
      await fetch('/api/aventuras', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(aventuras)
      });
      renderizar();
    }

    cargarAventuras();
  </script>
</body>
</html>
